<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TD — O Mundo de Leirham</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a0f;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #game-canvas {
        display: block;
        image-rendering: pixelated;
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
      }
      #loading {
        position: fixed;
        inset: 0;
        background: #0a0a0f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #f5d87a;
        font-family: serif;
        font-size: 1.4rem;
        letter-spacing: 0.15em;
        z-index: 10;
      }
      #loading.hidden { display: none; }
      #loading-ring {
        width: 48px;
        height: 48px;
        border: 3px solid #f5d87a44;
        border-top-color: #f5d87a;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading">
      <div id="loading-ring"></div>
      Co'ovatina desperta…
    </div>
    <canvas id="game-canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
